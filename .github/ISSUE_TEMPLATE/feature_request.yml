name: Feature request / 功能建议
description: Explain the problem and proposed behavior.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 建议行为
      description: Explain scope, alternatives and effects on safe pull-only behavior.
    validations:
      required: true
